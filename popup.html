<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e5;
      --accent: #2563eb;
      --toggle-bg: #d4d4d8;
    }

    [data-theme="dark"] {
      --bg: #18181b;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --accent: #3b82f6;
      --toggle-bg: #3f3f46;
    }

    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    button.theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
    }

    #notice {
      display: none;
      color: #ef4444;
      font-size: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .stats {
      text-align: center;
      margin-bottom: 24px;
    }

    #count {
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--toggle-bg);
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <header>
    <h1>CAI Ad Remover</h1>
    <button id="themeBtn" class="theme-btn">Dark</button>
  </header>

  <div id="notice">
    Open character.ai to use this extension.
  </div>

  <div id="mainUI">
    <div class="stats">
      <div id="count">0</div>
      <div class="label">Ads blocked</div>
    </div>

    <div class="settings">
      <span>Enable blocker</span>
      <label class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
